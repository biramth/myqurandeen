<!doctype html>
<!-- lang="en" neutre (pas "fr") : c'est ce que voit un crawler qui n'execute
     pas le JS (voir commentaire OG plus bas) - la vraie langue, elle, est
     posee cote client par PageMeta/i18n selon la preference de l'utilisateur. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Repli statique sitewide (description/OG/Twitter) : PageMeta.tsx pose
         des balises equivalentes par page cote client (react-helmet-async),
         mais un crawler qui n'execute pas de JS - la plupart des robots
         d'apercu de lien (WhatsApp, X, Facebook, Discord, Slack...), a la
         difference de Googlebot qui rend le JS - ne verra jamais que CE
         qui suit. Volontairement generique (pas de contenu par page) : une
         vraie parite d'apercu par page demanderait du SSR/prerendering, hors
         perimetre pour l'instant (le partage in-app avec image generee cote
         client, voir ShareButton, contourne cette limite differemment en
         transmettant directement un fichier plutot qu'un lien a "unfurl").
         data-rh-fallback : marque ces balises pour que PageMeta les retire
         des le premier montage (voir son useEffect) - sinon elles resteraient
         les PREMIERES du <head> en DOM (Helmet ne fait qu'ajouter les
         siennes ensuite, jamais retirer du HTML statique), et Google ne
         retient que la premiere balise description/OG rencontree : sans ce
         retrait, la version generique gagnerait toujours sur celle, plus
         specifique, posee par la page. -->
    <meta name="description" data-rh-fallback="true"
      content="myQurandeen - plateforme open-source d'étude du Coran, du hadith, du tafsir, du fiqh et de l'histoire de l'Islam."
    />
    <meta property="og:site_name" content="myQurandeen" data-rh-fallback="true" />
    <meta property="og:title" content="myQurandeen" data-rh-fallback="true" />
    <meta
      property="og:description" data-rh-fallback="true"
      content="Plateforme open-source d'étude du Coran, du hadith, du tafsir, du fiqh et de l'histoire de l'Islam."
    />
    <meta property="og:image" content="https://myqurandeen.vercel.app/icon-512.png" data-rh-fallback="true" />
    <meta property="og:type" content="website" data-rh-fallback="true" />
    <meta name="twitter:card" content="summary_large_image" data-rh-fallback="true" />
    <meta name="twitter:title" content="myQurandeen" data-rh-fallback="true" />
    <meta
      name="twitter:description" data-rh-fallback="true"
      content="Plateforme open-source d'étude du Coran, du hadith, du tafsir, du fiqh et de l'histoire de l'Islam."
    />
    <meta name="twitter:image" content="https://myqurandeen.vercel.app/icon-512.png" data-rh-fallback="true" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "myQurandeen",
        "url": "https://myqurandeen.vercel.app",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://myqurandeen.vercel.app/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f121a" media="(prefers-color-scheme: dark)" />
    <!-- Precharge la police arabe (texte coranique/hadith, present sur
         quasiment toutes les pages de contenu) pour eviter le flash de texte
         invisible/non stylise le temps que le CSS soit parse et la police
         demandee. Le chemin doit rester en phase avec la regle @font-face
         de src/index.css (chemin public stable, pas un fichier hashe). -->
    <link rel="preload" href="/fonts/amiri-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Reprend l'icone "BookOpen" de lucide-react (ISC, deja une dependance
         du projet, utilisee dans la nav) plutot que d'heberger un asset
         externe (icons8) : meme langage visuel, aucune requete externe, pas
         de question de licence a gerer separement. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231d726b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 7v14'/%3E%3Cpath d='M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z'/%3E%3C/svg%3E"
    />
    <!-- Manifest + icones "ajouter a l'ecran d'accueil" : sans ces deux
         lignes (et les PNG qu'elles referencent), iOS/Android ignorent le
         favicon SVG et affichent une capture d'ecran generique a la place du
         logo une fois le site epingle - c'etait le cas jusqu'ici. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>myQurandeen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
