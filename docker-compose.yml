services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: qurandeen
      POSTGRES_PASSWORD: qurandeen
      POSTGRES_DB: qurandeen
    ports:
      - "5432:5432"
    volumes:
      - qurandeen_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qurandeen"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optionnel : uniquement necessaire si AI_BACKEND=ollama (backend IA 100%
  # local). Par defaut le projet utilise Gemini (API distante) car
  # l'hebergement local demande plus de ressources machine que disponible
  # pour l'instant - voir apps/api/src/modules/ai/README.md. Ce service ne
  # demarre pas automatiquement avec `docker compose up` ; lancez-le a la
  # demande avec `docker compose --profile ollama up`.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - qurandeen_ollama_data:/root/.ollama
      - ./apps/api/ollama-entrypoint.sh:/ollama-entrypoint.sh
    entrypoint: ["/bin/sh", "/ollama-entrypoint.sh"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgres://qurandeen:qurandeen@postgres:5432/qurandeen
      WEB_URL: http://localhost:5173
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      AI_BACKEND: ${AI_BACKEND:-gemini}
      AI_EMBEDDING_DIM: ${AI_EMBEDDING_DIM:-768}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  qurandeen_postgres_data:
  qurandeen_ollama_data:
