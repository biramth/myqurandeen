services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: qurandeen
      POSTGRES_PASSWORD: qurandeen
      POSTGRES_DB: qurandeen
    ports:
      # Lie a localhost uniquement : accessible depuis la machine hote (utile
      # pour les scripts de seed lances en local, `npm run db:seed*`) mais
      # jamais expose au reseau exterieur si ce compose tourne sur un serveur.
      - "127.0.0.1:5432:5432"
    volumes:
      - qurandeen_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qurandeen"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optionnel : uniquement necessaire si AI_BACKEND=ollama (backend IA 100%
  # local). Par defaut le projet utilise Gemini (API distante) car
  # l'hebergement local demande plus de ressources machine que disponible
  # pour l'instant - voir apps/api/src/modules/ai/README.md. Ce service ne
  # demarre pas automatiquement avec `docker compose up` ; lancez-le a la
  # demande avec `docker compose --profile ollama up`.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - qurandeen_ollama_data:/root/.ollama
      - ./apps/api/ollama-entrypoint.sh:/ollama-entrypoint.sh
    entrypoint: ["/bin/sh", "/ollama-entrypoint.sh"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://qurandeen:qurandeen@postgres:5432/qurandeen}
      # Doit pointer vers l'origine reelle du frontend en production (sinon
      # le CORS rejette toute requete qui ne vient pas de localhost:5173).
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      REMINDER_RUN_TOKEN: ${REMINDER_RUN_TOKEN:-}
      AI_BACKEND: ${AI_BACKEND:-gemini}
      AI_EMBEDDING_DIM: ${AI_EMBEDDING_DIM:-768}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LLM_MODEL: ${GEMINI_LLM_MODEL:-gemini-3.6-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # URL publique de l'API, telle que le navigateur du visiteur doit la
        # joindre - a definir en production (build-time, fige dans le bundle
        # statique). http://localhost:3000 ne convient qu'en local.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  qurandeen_postgres_data:
  qurandeen_ollama_data:
